<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Усі події — Хартія-Хаб</title>
    <meta name="description" content="Афіша найближчих подій Хартія-Хабу: лекції, тренінги, кінопокази, дискусії та зустрічі з військовими.">
    <link rel="icon" href="img/logomark.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=5">
    <script src="js/data.js?v=4" defer></script>
    <script src="js/app.js?v=4" defer></script>
    <script src="js/fx.js?v=4" defer></script>
</head>
<body data-page="events">
    <a href="#main" class="skip-link">Перейти до змісту</a>
    <div id="site-header"></div>

    <main id="main" class="page">
        <section class="section section--page section--topo" aria-labelledby="eventsTitle">
            <canvas class="fx-canvas" data-fx="topo" aria-hidden="true"></canvas>
            <div class="section-container">
                <nav class="breadcrumbs" aria-label="Навігаційний ланцюжок">
                    <a href="index.html">Головна</a><span aria-hidden="true">/</span>
                    <span aria-current="page">Події</span>
                </nav>

                <div class="section-head">
                    <h1 class="section-title" id="eventsTitle">Усі події</h1>
                    <p class="section-count" id="eventsCount" aria-live="polite"></p>
                </div>

                <form class="filter-bar" id="filterForm" role="search" aria-label="Пошук подій">
                    <div class="filter-field">
                        <label for="filterCity">Місто</label>
                        <div class="select-wrapper"><select class="input" id="filterCity"></select></div>
                    </div>
                    <div class="filter-field">
                        <label for="filterCategory">Категорія</label>
                        <div class="select-wrapper"><select class="input" id="filterCategory"></select></div>
                    </div>
                    <div class="filter-field filter-field--search">
                        <label for="filterSearch">Пошук</label>
                        <div class="search-wrapper">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                            <input class="input" type="search" id="filterSearch" placeholder="Назва або тема події" autocomplete="off">
                        </div>
                    </div>
                    <button type="button" class="btn btn--ghost filter-reset" id="filterReset" hidden>Скинути</button>
                </form>

                <div class="events-grid" id="eventsGrid" aria-live="polite"></div>

                <div class="section-cta">
                    <button type="button" class="btn btn--ghost btn--lg" id="loadMoreBtn" hidden>Показати ще</button>
                </div>
            </div>
        </section>
    </main>

    <div id="site-footer"></div>
</body>
</html>
